<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - LibraryHub</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
  <a class="logo" href="index.html">LibraryHub</a>
  <button class="boton boton-claro boton-tema" type="button">
    <img src="img/iconoTema.png" alt="Cambiar tema">
  </button>
  <a href="login.html">Iniciar sesión</a>
  <a class="boton" href="registro.html">Registrarse</a>
</header>

  <main>
    <section class="caja login">
      <h1>Iniciar sesión</h1>
      <form>
        <label for="usuario">Usuario o correo</label>
        <input type="text" id="usuario">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave">
        <button class="boton" type="button">Ingresar</button>
      </form>
      <p>¿No hay administrador? <a href="registro-admin.html">Crear el primer administrador</a></p>
    </section>
  </main>
</body>
</html>
