<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse - LibraryHub</title>
  <link rel="stylesheet" href="css/estilos.css">

  <header>

    <button class="boton boton-claro boton-tema" type="button" title="Cambiar tema">

</button>
    <a href="login.html">Iniciar sesión</a>
    <a class="boton" href="registro.html">Registrarse</a>

  <main>
    <section class="caja login">
      <h1>Crear cuenta</h1>
      <form>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre">
        <label for="correo">Correo</label>
        <input type="email" id="correo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave">
        <label for="clave2">Repetir contraseña</label>
        <input type="password" id="clave2">
        <a  class="boton" href="catalogo.html">Registrarse</a>
      </form>
      <p>¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </section>
  </main>
  <footer id="footer-chiquito">
