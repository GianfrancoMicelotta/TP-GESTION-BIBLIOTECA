<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis préstamos - LibraryHub</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-seccion">
  <header>
    <a class="logo" href="catalogo.html">LibraryHub</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="mi-cuenta.html">Mi cuenta</a>
    <a href="carrito.html">Mis préstamos (2)</a>
    <div class="selector">
      <a href="admin.html">Administrador</a><a class="activo" href="catalogo.html">Usuario</a>
    </div>
    <button class="boton boton-claro boton-tema" type="button" title="Cambiar tema">
    <img src="img/iconoTema.png" alt="Cambiar tema">
    <a href="index.html">Salir</a>
  </header>

  <main>
    <h1>Mis préstamos</h1>
    <p>Revisá los libros que vas a retirar antes de confirmar.</p>
    <section class="caja">
      <div class="fila">
        <div class="portada azul">R</div>
        <div class="datos">
          <h3>Rayuela</h3>
          <p>Julio Cortázar</p>
        </div>
        <button class="boton boton-claro" type="button">Quitar</button>
      </div>
      <div class="fila">
        <div class="portada dorado">T</div>
        <div class="datos">
          <h3>El túnel</h3>
          <p>Ernesto Sabato</p>
        </div>
        <button class="boton boton-claro" type="button">Quitar</button>
      </div>
      <form>
        <label for="devolucion">Devolución estimada</label>
        <input type="date" id="devolucion">
        <button class="boton" type="button">Confirmar préstamo (2 libros)</button>
      </form>
    </section>
  </main>
</body>
</html>
