<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primer administrador - LibraryHub</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-seccion">
  <header>
    <a class="logo" href="index.html">LibraryHub</a>
    <button class="boton boton-claro boton-tema" type="button" title="Cambiar tema">
    <img src="img/iconoTema.png" alt="Cambiar tema">
</button>
    <a href="login.html">Iniciar sesión</a>
    <a class="boton" href="registro.html">Registrarse</a>
  </header>
  <main>
    <section class="caja login">
      <h1>Creá el primer administrador</h1>
      <p>No hay ningún administrador registrado. Esta cuenta podrá cargar libros.</p>
      <form>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre">
        <label for="correo">Correo</label>
        <input type="email" id="correo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave">
        <label for="clave2">Repetir contraseña</label>
        <input type="password" id="clave2">
        <label for="perfil">Perfil</label>
        <select id="perfil" disabled>
          <option>Administrador</option>
        </select>
        <a class="boton" href="admin.html">Crear administrador</a>
      </form>
    </section>
  </main>
  <footer id="footer-chiquito">
         <div>
            <h4>2026 Gestor de Biblioteca - PW1-20262C</h4>
         </div>
  </footer>
</body>
</html>
