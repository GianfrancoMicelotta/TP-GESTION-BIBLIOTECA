<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primer administrador - LibraryHub</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-seccion">
  <header class="navegacion">
    <a class="logo" href="index.html">libraryHub</a>
    <div class="nav-acciones">
      <a class="boton boton-login" href="login.html">Iniciar sesión</a>
      <a class="boton boton-registro" href="registro.html">Registrarse</a>
    </div>
  </header>
  <main>
    <section class="caja login">
      <h1>Creá el primer administrador</h1>
      <p>No hay ningún administrador registrado. Esta cuenta podrá cargar libros.</p>
      <form>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre">
        <label for="correo">Correo</label>
        <input type="email" id="correo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave">
        <label for="clave2">Repetir contraseña</label>
        <input type="password" id="clave2">
        <label for="perfil">Perfil</label>
        <select id="perfil" disabled>
          <option>Administrador</option>
        </select>
        <button class="boton" type="button">Crear administrador</button>
      </form>
    </section>
  </main>
</body>
</html>
